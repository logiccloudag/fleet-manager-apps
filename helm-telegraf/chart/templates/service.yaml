apiVersion: v1
kind: Service
metadata:
  name: {{ include "telegraf.fullname" . }}
  labels:
    {{- include "telegraf.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    {{- include "telegraf.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ int .Values.service.port }}
      targetPort: metrics
      protocol: TCP
