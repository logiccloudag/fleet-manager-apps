# Values of the wrapper chart influxdb2-restricted. Everything below is
# passed to the upstream subchart influxdata/influxdb2 2.1.2, which
# patches/0001-openshift-ids.patch changes only in its security contexts.
#
# The kubernetes-agent sets every Margo parameter as a string (like
# `helm --set-string`). The typed values that make the pod pass Pod Security
# "restricted" (booleans, user IDs, the capability list) therefore live here,
# not in app/margo.yaml. The string values an operator may change (password,
# organisation, sizes, resources) are Margo parameters.

# InfluxDB 1.x (v1) databases mapped to buckets (DBRP mappings), for
# InfluxQL clients that expect a database name other than the bucket's
# (InfluxDB already maps every bucket to the database of the same name).
# Comma separated entries "bucket:database". A missing bucket is created
# with the initial bucket's retention. Empty: no Job, no mapping. A Job of
# this chart (templates/v1-databases-job.yaml) creates the missing mappings
# on every install and upgrade.
v1Databases: ""

# Pod security context of that Job (the InfluxDB container's settings
# below apply to its container as well, including the IDs outside OpenShift).
podSecurityContext: {}

# OpenShift detection (patches/0001-openshift-ids.patch): "auto" (default)
# checks for the API group security.openshift.io/v1. On OpenShift the
# security contexts below are used as they are (the restricted SCC assigns
# the IDs and rejects fixed ones); on any other cluster the keys of
# *OutsideOpenShift are added, because nothing else assigns a non-root UID.
# "true" or "false" skips the detection.
global:
  openshift: auto

influxdb2:
  image:
    # The copy of docker.io/library/influxdb in the catalog's image registry
    # (scripts/images.tsv). The upstream chart has no digest field, so the
    # tag carries the multi-arch index digest.
    repository: ghcr.io/logiccloudag/margo-images/influxdb
    # The upstream chart pins 2.7.4 (2023-12); 2.9.1 is the current 2.x release.
    tag: 2.9.1-alpine@sha256:f551adeb94b6f97626d2043ec90ed17f81de18d15bb5412d2101e0965c93c797
  # Container security context: Pod Security "restricted". The upstream
  # chart derives the pod's fsGroup from runAsGroup. No runAsUser or
  # runAsGroup here: OpenShift's restricted SCC assigns them from the
  # namespace's UID range and rejects fixed IDs.
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  # Added to securityContext outside OpenShift: the influxdb user of the
  # image (the official image starts as root), and fsGroup 1000 for the volume.
  securityContextOutsideOpenShift:
    runAsUser: 1000
    runAsGroup: 1000
  # The agent's Role cannot create PodDisruptionBudgets (KA-A-20).
  pdb:
    create: false
  service:
    port: 8086
  persistence:
    enabled: true
    size: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
