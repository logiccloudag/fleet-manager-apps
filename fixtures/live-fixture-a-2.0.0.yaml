apiVersion: v1
id: live-fixture-a
metadata:
  name: "Live Fixture A"
  version: "2.0.0"
  description: >-
    WFM live-suite fixture (FM-1839). Not catalog content.
  catalog:
    organization:
      - name: logiccloud
        site: https://logiccloud.io
    application:
      tagline: Fixture for the WFM live suites.
      tags:
        - fixture
deploymentProfiles:
  - type: compose
    id: compose-solo
    components:
      - name: node-red-compose
        properties:
          repository: oci://ghcr.io/logiccloudag/margo-compose/node-red
          revision: "1.0.0"
          wait: true
          timeout: "10m0s"
    deviceConstraints:
      capacityRequirements:
        cpu:
          cores: 0.5
          architectures:
            - amd64
            - arm64
        memory: 512Mi
        storage: 5Gi
parameters:
  servicePort:
    value: "1880"
    targets:
      - pointer: service.port
        components: [node-red-compose]
      - pointer: NODE_RED_PORT
        components: [node-red-compose]
  memoryRequest:
    value: "128Mi"
    targets:
      - pointer: resources.requests.memory
        components: [node-red-compose]
configuration:
  sections:
    - name: Service and resources
      settings:
        - parameter: servicePort
          name: Service port
          schema: port
        - parameter: memoryRequest
          name: Memory request
          schema: quantity
  schema:
    - name: port
      dataType: string
    - name: quantity
      dataType: string
