apiVersion: margo/v1alpha1
kind: ApplicationDescription
id: grafana
metadata:
  name: Grafana
  version: "1.3.0-openshift.1"
  description: >-
    Grafana 13 for dashboards and visualisation of time series data, installed
    from the upstream grafana-community Helm chart. Runs under Pod Security
    "restricted" with namespace-scoped resources only. Requires Kubernetes
    1.25 or later (the chart declares kubeVersion ^1.25.0-0); it does not
    install on older clusters such as MicroShift 4.8 (Kubernetes 1.21).
    A compose profile runs the same image with Docker Compose.
  catalog:
    organization:
      - name: logiccloud
        site: https://logiccloud.io
    application:
      tagline: Dashboards and visualisation for metrics, logs and time series.
      icon: icon.png
      releaseNotes: release-notes.md
      site: https://grafana.com/oss/grafana/
      tags:
        - monitoring
        - dashboards
        - visualisation
deploymentProfiles:
  - type: helm
    id: kubernetes
    components:
      - name: grafana
        properties:
          # Wrapper around the unchanged grafana-community grafana chart
          # 13.7.0 without fixed UID, GID and fsGroup (OpenShift; helm-grafana/chart).
          repository: oci://ghcr.io/logiccloudag/margo-charts/grafana-restricted
          revision: "0.1.0-openshift.1"
          wait: true
          timeout: "10m0s"
    requiredResources:
      cpu:
        cores: 0.5
        architectures:
          - amd64
          - arm64
      memory: 512Mi
      storage: 5Gi
  - type: compose
    id: compose
    components:
      - name: grafana-compose
        properties:
          # The compose package built from helm-grafana/compose
          # (scripts/publish-compose.sh).
          repository: oci://ghcr.io/logiccloudag/margo-compose/grafana
          revision: "1.1.0"
          wait: true
          timeout: "10m0s"
    requiredResources:
      cpu:
        cores: 0.5
        architectures:
          - amd64
          - arm64
      memory: 512Mi
      storage: 5Gi
# Every parameter reaches the kubernetes-agent as a string and is set like
# `helm --set-string` at the dot path in `pointer`. Helm treats every
# non-empty string as true, so a chart boolean that defaults to true can only
# be switched off with the empty string "". The parameters marked "Fixed" make
# the chart pass Pod Security "restricted" and stay inside the agent's
# namespace-scoped Role. They are not listed in `configuration`: do not
# override them.
# A target of a *-compose component names an environment variable of
# compose/compose.yaml instead (Margo Target.pointer for compose); its
# default there equals the value here. Parameters without such a target
# (for example sizes, resources and the fixed ones) apply to the Helm
# profile only.
parameters:
  # Fixed: the copy of docker.io/grafana/grafana in the catalog's image
  # registry, pulled by its multi-arch index digest (scripts/images.tsv).
  imageRegistry:
    value: "ghcr.io"
    targets:
      - pointer: grafana.image.registry
        components: [grafana]
  imageRepository:
    value: "logiccloudag/margo-images/grafana"
    targets:
      - pointer: grafana.image.repository
        components: [grafana]
  imageTag:
    value: "13.2.4-distroless"
    targets:
      - pointer: grafana.image.tag
        components: [grafana]
  # The chart prefixes "sha256:" itself.
  imageSha:
    value: "ae3d3add290adbe6a88412229f5d76fd7bb82743050881698642d3d62f277e35"
    targets:
      - pointer: grafana.image.sha
        components: [grafana]
  # Fixed: the agent's Role cannot create Role, RoleBinding or ClusterRole
  # objects. Grafana needs RBAC only for its (disabled) sidecars.
  rbacCreate:
    value: ""
    targets:
      - pointer: grafana.rbac.create
        components: [grafana]
  # Fixed: keep any RBAC the chart renders namespaced (no ClusterRole).
  rbacNamespaced:
    value: "true"
    targets:
      - pointer: grafana.rbac.namespaced
        components: [grafana]
  # Fixed: the init-chown-data init container runs as root, which Pod
  # Security "restricted" forbids. The fsGroup that OpenShift's restricted SCC
  # assigns gives Grafana write access to the volume.
  initChownDataEnabled:
    value: ""
    targets:
      - pointer: grafana.initChownData.enabled
        components: [grafana]
  # Fixed: no `helm test` resources.
  testFrameworkEnabled:
    value: ""
    targets:
      - pointer: grafana.testFramework.enabled
        components: [grafana]
  # Fixed: store dashboards and the SQLite database on a PVC of the cluster
  # default StorageClass. "false" would NOT disable it (non-empty string).
  persistenceEnabled:
    value: "true"
    targets:
      - pointer: grafana.persistence.enabled
        components: [grafana]
  persistenceSize:
    value: "5Gi"
    targets:
      - pointer: grafana.persistence.size
        components: [grafana]
  servicePort:
    value: "80"
    targets:
      - pointer: grafana.service.port
        components: [grafana]
      - pointer: GRAFANA_PORT
        components: [grafana-compose]
  adminUser:
    value: "admin"
    targets:
      - pointer: grafana.adminUser
        components: [grafana]
      - pointer: GF_SECURITY_ADMIN_USER
        components: [grafana-compose]
  # Empty: the chart generates a random password and keeps it in the Secret
  # <release>-grafana (key admin-password) across upgrades.
  adminPassword:
    value: ""
    targets:
      - pointer: grafana.adminPassword
        components: [grafana]
      - pointer: GF_SECURITY_ADMIN_PASSWORD
        components: [grafana-compose]
  # Name of an existing Secret in the agent's namespace with the keys
  # admin-user and admin-password. Takes precedence over adminUser and
  # adminPassword when set.
  adminExistingSecret:
    value: ""
    targets:
      - pointer: grafana.admin.existingSecret
        components: [grafana]
  cpuRequest:
    value: "100m"
    targets:
      - pointer: grafana.resources.requests.cpu
        components: [grafana]
  memoryRequest:
    value: "128Mi"
    targets:
      - pointer: grafana.resources.requests.memory
        components: [grafana]
  memoryLimit:
    value: "512Mi"
    targets:
      - pointer: grafana.resources.limits.memory
        components: [grafana]
configuration:
  sections:
    - name: Administrator
      settings:
        - parameter: adminUser
          name: Administrator user name
          schema: text
        - parameter: adminPassword
          name: Administrator password (empty generates one on Kubernetes, compose uses admin)
          schema: optionalText
        - parameter: adminExistingSecret
          name: Existing Secret with admin-user and admin-password (Kubernetes)
          schema: optionalText
    - name: Service and storage
      settings:
        - parameter: servicePort
          name: Service port
          schema: port
        - parameter: persistenceSize
          name: Volume size
          schema: quantity
          immutable: true
    - name: Resources
      settings:
        - parameter: cpuRequest
          name: CPU request
          schema: quantity
        - parameter: memoryRequest
          name: Memory request
          schema: quantity
        - parameter: memoryLimit
          name: Memory limit
          schema: quantity
  schema:
    - name: text
      dataType: string
    # Empty is a valid value (Margo allowEmpty, PR #212): without it
    # fleet-manager marks a setting with an empty default as required.
    - name: optionalText
      dataType: string
      allowEmpty: true
    - name: port
      dataType: string
    - name: quantity
      dataType: string
