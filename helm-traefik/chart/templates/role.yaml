# What Traefik's Kubernetes Ingress provider reads in its own namespace
# (upstream chart rbac.namespaced). Only the networking.k8s.io API group:
# the kubernetes-agent can grant only rules it holds itself (KA-211), and it
# holds none in the removed "extensions" group.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "traefik.fullname" . }}
  labels:
    {{- include "traefik.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
