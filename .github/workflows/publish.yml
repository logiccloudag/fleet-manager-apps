# Publishes the catalog from main to ghcr.io/logiccloudag after the checks
# pass: the pinned images (margo-images), the charts (margo-charts) and the
# compose packages (margo-compose). Every script refuses to overwrite a
# published tag with different content. The last job checks without
# credentials that devices can pull everything.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  publish:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          set -euo pipefail
          scripts/ci/install-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyyaml==6.0.3"
          echo "$RUNNER_TEMP/venv/bin" >>"$GITHUB_PATH"

      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Images
        run: scripts/mirror-images.sh

      - name: Charts
        run: scripts/mirror-charts.sh

      - name: Compose packages
        run: scripts/publish-compose.sh

      - name: Log out of ghcr.io
        if: always()
        run: |
          crane auth logout ghcr.io || true
          oras logout ghcr.io || true
          helm registry logout ghcr.io || true

  verify-public:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          set -euo pipefail
          scripts/ci/install-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyyaml==6.0.3"
          echo "$RUNNER_TEMP/venv/bin" >>"$GITHUB_PATH"

      # Fails until a human made every new package public (README.md
      # "Publishing"); the error lists them.
      - name: Pull everything without credentials
        run: scripts/verify-public.sh
