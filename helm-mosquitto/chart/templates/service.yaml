apiVersion: v1
kind: Service
metadata:
  name: {{ include "mosquitto.fullname" . }}
  labels:
    {{- include "mosquitto.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    {{- include "mosquitto.selectorLabels" . | nindent 4 }}
  ports:
    - name: mqtt
      port: {{ int .Values.service.port }}
      targetPort: mqtt
      protocol: TCP
