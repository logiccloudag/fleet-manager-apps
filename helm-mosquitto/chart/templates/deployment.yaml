apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mosquitto.fullname" . }}
  labels:
    {{- include "mosquitto.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One broker, and a ReadWriteOnce volume: stop the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mosquitto.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mosquitto.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mosquitto
          image: {{ include "mosquitto.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
          ports:
            - name: mqtt
              containerPort: {{ include "mosquitto.port" . }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 20
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
            {{- if .Values.auth.existingSecret }}
            - name: auth
              mountPath: /mosquitto/auth
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "mosquitto.fullname" . }}
        - name: data
          {{- if include "mosquitto.isTrue" .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mosquitto.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.auth.existingSecret }}
        - name: auth
          secret:
            secretName: {{ .Values.auth.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.auth.passwordFileKey }}
                path: {{ .Values.auth.passwordFileKey }}
        {{- end }}
