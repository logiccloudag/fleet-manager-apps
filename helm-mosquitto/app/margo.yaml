apiVersion: v1
id: mosquitto
metadata:
  name: Eclipse Mosquitto
  version: "2.2.0"
  description: >-
    Eclipse Mosquitto 2.1 MQTT broker (MQTT 3.1, 3.1.1 and 5.0) from the
    official eclipse-mosquitto image, installed from mosquitto-restricted, a
    small logiccloud chart. Runs under Pod Security "restricted" with
    namespace-scoped resources only. Anonymous access is disabled: clients
    authenticate against a password file from an existing Secret.
    A compose profile runs the same image with Docker Compose.
  catalog:
    organization:
      - name: logiccloud
        site: https://logiccloud.io
    application:
      tagline: Lightweight MQTT message broker for IoT and pub/sub messaging.
      icon: icon.png
      releaseNotes: release-notes.md
      site: https://mosquitto.org
      tags:
        - mqtt
        - messaging
        - iot
deploymentProfiles:
  - type: helm
    id: kubernetes
    components:
      - name: mosquitto
        properties:
          # The chart in helm-mosquitto/chart.
          repository: oci://ghcr.io/logiccloudag/margo-charts/mosquitto-restricted
          revision: "0.2.0"
          wait: true
          timeout: "10m0s"
    deviceConstraints:
      capacityRequirements:
        cpu:
          cores: 0.25
          architectures:
            - amd64
            - arm64
        memory: 128Mi
        storage: 1Gi
  - type: compose
    id: compose
    components:
      - name: mosquitto-compose
        properties:
          # The compose package built from helm-mosquitto/compose
          # (scripts/publish-compose.sh).
          repository: oci://ghcr.io/logiccloudag/margo-compose/mosquitto
          revision: "1.0.0"
          wait: true
          timeout: "10m0s"
    deviceConstraints:
      capacityRequirements:
        cpu:
          cores: 0.25
          architectures:
            - amd64
            - arm64
        memory: 128Mi
        storage: 1Gi
# Every parameter reaches the kubernetes-agent as a string and is set like
# `helm --set-string` at the dot path in `pointer`. The chart reads every
# value string-safely: "false" switches a boolean off, numbers may be strings.
# The Pod Security settings (UID 1883, seccomp RuntimeDefault, no privilege
# escalation, all capabilities dropped, read-only root file system) are fixed
# in the chart and are not parameters.
# A target of a *-compose component names an environment variable of
# compose/compose.yaml instead (Margo Target.pointer for compose); its
# default there equals the value here. Parameters without such a target
# (for example sizes, resources and the fixed ones) apply to the Helm
# profile only.
parameters:
  # Port the broker listens on inside the pod (1024 to 65535).
  listenerPort:
    value: "1883"
    targets:
      - pointer: listener.port
        components: [mosquitto]
      - pointer: MOSQUITTO_LISTENER_PORT
        components: [mosquitto-compose]
  servicePort:
    value: "1883"
    targets:
      - pointer: service.port
        components: [mosquitto]
      - pointer: MOSQUITTO_PORT
        components: [mosquitto-compose]
  # ClusterIP, NodePort or LoadBalancer.
  serviceType:
    value: "ClusterIP"
    targets:
      - pointer: service.type
        components: [mosquitto]
  # Name of an existing Secret in the agent's namespace that holds a
  # mosquitto_passwd password file. Empty: with anonymous access disabled,
  # no client can connect.
  authExistingSecret:
    value: ""
    targets:
      - pointer: auth.existingSecret
        components: [mosquitto]
  authPasswordFileKey:
    value: "passwd"
    targets:
      - pointer: auth.passwordFileKey
        components: [mosquitto]
  # Compose profile only: one user in a password file the container writes
  # to memory at start (a compose package carries no Secret). Empty: no
  # password file. A user name needs a password.
  mqttUsername:
    value: ""
    targets:
      - pointer: MOSQUITTO_USERNAME
        components: [mosquitto-compose]
  mqttPassword:
    value: ""
    targets:
      - pointer: MOSQUITTO_PASSWORD
        components: [mosquitto-compose]
  # "true" allows clients without credentials.
  allowAnonymous:
    value: "false"
    targets:
      - pointer: auth.allowAnonymous
        components: [mosquitto]
      - pointer: MOSQUITTO_ALLOW_ANONYMOUS
        components: [mosquitto-compose]
  # "true": message store on a PVC of the cluster default StorageClass;
  # "false": an emptyDir (lost on restart).
  persistenceEnabled:
    value: "true"
    targets:
      - pointer: persistence.enabled
        components: [mosquitto]
  persistenceSize:
    value: "1Gi"
    targets:
      - pointer: persistence.size
        components: [mosquitto]
  cpuRequest:
    value: "50m"
    targets:
      - pointer: resources.requests.cpu
        components: [mosquitto]
  memoryRequest:
    value: "32Mi"
    targets:
      - pointer: resources.requests.memory
        components: [mosquitto]
  memoryLimit:
    value: "128Mi"
    targets:
      - pointer: resources.limits.memory
        components: [mosquitto]
configuration:
  sections:
    - name: Authentication
      settings:
        - parameter: authExistingSecret
          name: Secret with the password file (Kubernetes)
          schema: optionalText
        - parameter: authPasswordFileKey
          name: Key of the password file in the Secret (Kubernetes)
          schema: text
        - parameter: mqttUsername
          name: User name (compose)
          schema: optionalText
        - parameter: mqttPassword
          name: Password (compose)
          schema: optionalText
        - parameter: allowAnonymous
          name: Allow anonymous clients (true or false)
          schema: text
    - name: Network
      settings:
        - parameter: listenerPort
          name: Broker listener port
          schema: port
        - parameter: servicePort
          name: Service port
          schema: port
        - parameter: serviceType
          name: Service type (ClusterIP, NodePort or LoadBalancer)
          schema: text
    - name: Storage
      settings:
        - parameter: persistenceEnabled
          name: Persistent message store (true or false)
          schema: text
          immutable: true
        - parameter: persistenceSize
          name: Volume size
          schema: quantity
          immutable: true
    - name: Resources
      settings:
        - parameter: cpuRequest
          name: CPU request
          schema: quantity
        - parameter: memoryRequest
          name: Memory request
          schema: quantity
        - parameter: memoryLimit
          name: Memory limit
          schema: quantity
  schema:
    - name: text
      dataType: string
    # Empty is a valid value (Margo allowEmpty, PR #212): without it
    # fleet-manager marks a setting with an empty default as required.
    - name: optionalText
      dataType: string
      allowEmpty: true
    - name: port
      dataType: string
    - name: quantity
      dataType: string
