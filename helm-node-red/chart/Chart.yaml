apiVersion: v2
name: node-red-restricted
description: >-
  Node-RED for the kubernetes-agent on OpenShift. A thin wrapper around the
  unchanged upstream schwarzit node-red chart that removes the chart's fixed
  runAsUser, runAsGroup and fsGroup (1000). OpenShift's restricted SCC
  assigns them from the namespace's UID range and rejects fixed IDs. Margo
  parameters reach the agent as strings only, so these values cannot be
  removed through parameters.
type: application
version: 0.1.0-openshift.1
appVersion: "4.1.2"
home: https://github.com/logiccloudag/fleet-manager-apps
sources:
  - https://github.com/SchwarzIT/node-red-chart
  - https://github.com/node-red/node-red-docker
annotations:
  artifacthub.io/license: Apache-2.0
dependencies:
  - name: node-red
    version: 0.40.2
    repository: oci://ghcr.io/schwarzit/charts
